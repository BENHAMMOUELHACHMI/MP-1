name: Mise à jour automatique des documents

on:
  push:
    paths:
      - 'pdf/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-documents:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Générer documents.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          dossier = Path("pdf")
          fichiers = []

          if dossier.exists():
              for fichier in sorted(
                  dossier.rglob("*.pdf"),
                  key=lambda p: str(p).lower()
              ):
                  fichiers.append({
                      "nom": fichier.name,
                      "fichier": str(fichier).replace("\\", "/")
                  })

          with open("documents.json", "w", encoding="utf-8") as f:
              json.dump(fichiers, f, ensure_ascii=False, indent=2)

          print(f"{len(fichiers)} document(s) trouvé(s).")
          PY

      - name: Enregistrer documents.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "Mise à jour automatique des documents [skip ci]"
            git push
          fi
