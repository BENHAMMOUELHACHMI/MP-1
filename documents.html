<!doctype html>

<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Documents — MP-1</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fa;
    color:#24313d;
}

header{
    background:#17324d;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
    font-size:1.3rem;
}

main{
    max-width:1000px;
    margin:auto;
    padding:30px 20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#24577a;
    text-decoration:none;
}

h2{
    color:#17324d;
}

#path{
    color:#657381;
    margin-bottom:20px;
}

.item{
    background:white;
    border:1px solid #d9e1e8;
    padding:16px;
    margin-bottom:8px;
    border-radius:8px;
}

.item a{
    text-decoration:none;
    color:#24577a;
    font-weight:bold;
}

.error{
    background:white;
    border-left:4px solid #c62828;
    padding:20px;
}

footer{
    text-align:center;
    color:#657381;
    padding:30px;
}
</style>

</head>

<body>

<header>
<h1>Pr. Ag. E. BENHAMMOU</h1>
</header>

<main>

<a class="back" href="index.html">
← Retour au site
</a>

<h2 id="title">Documents</h2>

<div id="path"></div>

<div id="content">
Chargement...
</div>

</main>

<footer>
Pr. Ag. E. BENHAMMOU · MP-1 — CPGE Laâyoune
</footer>

<script>

const OWNER = "BENHAMMOUELHACHMI";
const REPO = "MP-1";
const BRANCH = "main";

/* Récupération du dossier demandé */

const params = new URLSearchParams(window.location.search);

let path = params.get("path") || "pdf";

/* Nettoyage du chemin */

path = path.replace(/^\/+/, "");
path = path.replace(/\/+$/, "");

/* Affichage du chemin */

document.getElementById("path").textContent =
    "Dossier : " + path;

/* Titre du dossier */

const parts = path.split("/");

document.getElementById("title").textContent =
    parts[parts.length - 1].replace(/[-_]/g, " ");

/* API GitHub */

const api =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPO +
    "/contents/" +
    path +
    "?ref=" +
    BRANCH;

/* Chargement */

fetch(api, {
    headers: {
        "Accept": "application/vnd.github+json"
    }
})

.then(response => {

    if(!response.ok){
        throw new Error(
            "GitHub a retourné l'erreur " + response.status
        );
    }

    return response.json();

})

.then(data => {

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    if(!Array.isArray(data)){

        content.innerHTML =
            "<div class='error'>" +
            "Ce chemin ne correspond pas à un dossier." +
            "</div>";

        return;
    }

    /* Tri :
       dossiers d'abord,
       puis fichiers PDF
    */

    data.sort((a,b) => {

        if(a.type !== b.type){
            return a.type === "dir" ? -1 : 1;
        }

        return a.name.localeCompare(
            b.name,
            "fr",
            {numeric:true}
        );

    });

    let found = false;

    data.forEach(item => {

        /* Dossier */

        if(item.type === "dir"){

            found = true;

            const div =
                document.createElement("div");

            div.className = "item";

            const a =
                document.createElement("a");

            a.href =
                "documents.html?path=" +
                encodeURIComponent(item.path);

            a.textContent =
                "📁 " + item.name;

            div.appendChild(a);

            content.appendChild(div);
        }

        /* PDF */

        else if(
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".pdf")
        ){

            found = true;

            const div =
                document.createElement("div");

            div.className = "item";

            const a =
                document.createElement("a");

            /*
             * URL du fichier sur GitHub Pages
             */

            a.href =
                "./" +
                item.path
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/");

            a.target = "_blank";

            a.rel = "noopener";

            a.textContent =
                "📄 " + item.name;

            div.appendChild(a);

            content.appendChild(div);
        }

    });

    if(!found){

        content.innerHTML =
            "<div class='error'>" +
            "Aucun document PDF dans ce dossier." +
            "</div>";
    }

})

.catch(error => {

    document.getElementById("content").innerHTML =

        "<div class='error'>" +

        "<strong>Impossible de charger les documents.</strong><br><br>" +

        error.message +

        "<br><br>" +

        "Vérifiez que le dépôt GitHub est public et que le dossier existe." +

        "</div>";

});

</script>

</body>
</html>
