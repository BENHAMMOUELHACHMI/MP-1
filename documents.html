<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documents — MP-1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#24313d;}
header{background:#17324d;color:white;padding:20px;}
header h1{margin:0;font-size:1.3rem;}
main{max-width:1000px;margin:auto;padding:30px 20px;}
.back{display:inline-block;margin-bottom:20px;color:#24577a;text-decoration:none;}
h2{color:#17324d;}
#path{color:#657381;margin-bottom:20px;}
.item{background:white;border:1px solid #d9e1e8;padding:16px;margin-bottom:8px;border-radius:8px;}
.item a{text-decoration:none;color:#24577a;font-weight:bold;}
.error{background:white;border-left:4px solid #c62828;padding:20px;}
footer{text-align:center;color:#657381;padding:30px;}

/* Style pour la boîte d'encouragement */
.message-encouragement {
    font-size: 1.1rem;
    font-weight: bold;
    color: #1e3a8a; 
    background-color: #eff6ff; 
    border: 1px solid #bfdbfe;
    border-left: 5px solid #3b82f6;
    padding: 12px 20px;
    border-radius: 6px;
    margin-bottom: 15px;
    display: none; /* Masqué par défaut */
}
</style>
</head>
<body>

<header>
<h1>Pr. Ag. E. BENHAMMOU</h1>
</header>

<main>
<a class="back" href="index.html">← Retour au site</a>
<h2 id="title">Documents</h2>
<div id="path"></div>

<!-- Zone de notification pour vos élèves -->
<div id="zone-message" class="message-encouragement"></div>

<div id="content">Chargement...</div>
</main>

<footer>
Pr. Ag. E. BENHAMMOU · MP-1 — CPGE Laâyoune
</footer>

<script>
const params = new URLSearchParams(window.location.search);
let currentPath = params.get("path") || "pdf";

// Nettoyage et affichage du chemin
currentPath = currentPath.replace(/^\/+|\/+$/g, "");
document.getElementById("path").textContent = "Dossier : " + currentPath;

const parts = currentPath.split("/");
document.getElementById("title").textContent = parts[parts.length - 1].replace(/[-_]/g, " ");

// Banque de messages stimulants pour vos étudiants de CPGE
const messages = [
    "💪 Excellent choix ! La persévérance est la clé du succès en CPGE.",
    "🌟 Bravo pour votre curiosité scientifique, continuez ainsi !",
    "🚀 Cap sur la réussite ! Vous avancez à grands pas.",
    "📚 Chaque notion étudiée aujourd'hui construit votre réussite aux concours !",
    "🧠 Les sciences physiques n'attendent que votre logique !",
    "🎯 Restez régulier dans vos efforts, le travail paie toujours !"
];

// Fonction pour afficher un message aléatoire au-dessus
function afficherEncouragement() {
    const zoneMessage = document.getElementById('zone-message');
    if (zoneMessage) {
        const messageAleatoire = messages[Math.floor(Math.random() * messages.length)];
        zoneMessage.textContent = messageAleatoire;
        zoneMessage.style.display = 'block';
        
        // Fermeture automatique du message après 4 secondes
        setTimeout(() => {
            zoneMessage.style.display = 'none';
        }, 4000);
    }
}

// Chargement directement depuis votre documents.json automatique
fetch("./documents.json")
.then(response => {
    if(!response.ok) throw new Error("Le fichier de données documents.json est introuvable à la racine.");
    return response.json();
})
.then(allFiles => {
    const content = document.getElementById("content");
    content.innerHTML = "";

    const subDirs = new Set();
    const pdfsInDir = [];

    allFiles.forEach(item => {
        const filePath = item.fichier; 
        
        if (filePath.startsWith(currentPath + "/")) {
            const relativePart = filePath.substring(currentPath.length + 1);
            const pathParts = relativePart.split("/");

            if (pathParts.length > 1) {
                // RECTIFIÉ : Ajout strict du premier élément textuel [0] pour éviter le plantage
                subDirs.add(pathParts[0]);
            } else if (pathParts.length === 1 && filePath.toLowerCase().endsWith(".pdf")) {
                pdfsInDir.push(item);
            }
        }
    });

    let found = false;

    // 1. Affichage des sous-dossiers
    Array.from(subDirs).sort().forEach(dirName => {
        found = true;
        const div = document.createElement("div");
        div.className = "item";
        const a = document.createElement("a");
        a.href = "documents.html?path=" + encodeURIComponent(currentPath + "/" + dirName);
        a.textContent = "📁 " + dirName;
        
        // Déclencheur au clic sur un dossier
        a.addEventListener('click', afficherEncouragement);
        
        div.appendChild(a);
        content.appendChild(div);
    });

    // 2. Affichage des fichiers PDF
    pdfsInDir.sort((a,b) => a.nom.localeCompare(b.nom, "fr", {numeric:true})).forEach(item => {
        found = true;
        const div = document.createElement("div");
        div.className = "item";
        const a = document.createElement("a");
        
        a.href = "./" + item.fichier.split("/").map(encodeURIComponent).join("/");
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "📄 " + item.nom;
        
        // Déclencheur au clic sur un PDF
        a.addEventListener('click', afficherEncouragement);
        
        div.appendChild(a);
        content.appendChild(div);
    });

    if(!found){
        content.innerHTML = "<div class='error'>Aucun document ou sous-dossier ici.</div>";
    }
})
.catch(error => {
    document.getElementById("content").innerHTML =
        "<div class='error'><strong>Impossible de charger les documents.</strong><br><br>" +
        error.message + "<br><br>Vérifiez que l'Action GitHub a bien fonctionné au moins une fois pour générer le fichier documents.json.</div>";
});
</script>
</body>
</html>
