<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Documents — MP-1</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fa;
    color:#24313d;
}

header{
    background:#17324d;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
    font-size:1.3rem;
}

main{
    max-width:1000px;
    margin:auto;
    padding:30px 20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#24577a;
    text-decoration:none;
}

h2{
    color:#17324d;
}

#path{
    color:#657381;
    margin-bottom:20px;
}

.item{
    background:white;
    border:1px solid #d9e1e8;
    padding:16px;
    margin-bottom:8px;
    border-radius:8px;
}

.item a{
    text-decoration:none;
    color:#24577a;
    font-weight:bold;
}

.error{
    background:white;
    border-left:4px solid #c62828;
    padding:20px;
}

footer{
    text-align:center;
    color:#657381;
    padding:30px;
}

</style>
</head>

<body>

<header>
<h1>Pr. Ag. E. BENHAMMOU</h1>
</header>

<main>

<a class="back" href="index.html">
← Retour au site
</a>

<h2 id="title">
Documents
</h2>

<div id="path"></div>

<div id="content">
Chargement...
</div>

</main>

<footer>
Pr. Ag. E. BENHAMMOU · MP-1 — CPGE Laâyoune
</footer>


<script>

const params = new URLSearchParams(
    window.location.search
);

let currentPath =
    params.get("path") || "pdf";

currentPath = decodeURIComponent(currentPath)
    .replace(/^\/+/, "")
    .replace(/\/+$/, "");


/* Affichage du chemin */

document.getElementById("path").textContent =
    "Dossier : " + currentPath;


/* Titre */

const parts = currentPath.split("/");

document.getElementById("title").textContent =
    parts[parts.length - 1]
        .replace(/[-_]/g," ");


/* Chargement du fichier JSON */

fetch("documents.json?t=" + Date.now())

.then(response => {

    if(!response.ok){
        throw new Error(
            "Impossible de charger documents.json"
        );
    }

    return response.json();

})

.then(files => {

    const content =
        document.getElementById("content");

    content.innerHTML = "";

    if(!Array.isArray(files)){
        throw new Error(
            "documents.json est invalide."
        );
    }


    /*
     * On cherche :
     *
     * 1. les PDF directement dans le dossier
     * 2. les sous-dossiers contenant des PDF
     */


    const prefix =
        currentPath + "/";

    const directFiles = [];

    const directories = new Set();


    files.forEach(file => {

        if(!file.startsWith(prefix)){
            return;
        }

        const rest =
            file.substring(prefix.length);


        /*
         * PDF directement dans le dossier
         */

        if(!rest.includes("/")){

            directFiles.push(file);

        }


        /*
         * PDF dans un sous-dossier
         */

        else{

            const directory =
                rest.split("/")[0];

            directories.add(
                prefix + directory
            );

        }

    });


    let found = false;


    /*
     * Afficher les dossiers
     */

    [...directories]
        .sort((a,b) =>
            a.localeCompare(b,"fr")
        )
        .forEach(directory => {

            found = true;

            const div =
                document.createElement("div");

            div.className = "item";

            const a =
                document.createElement("a");

            a.href =
                "documents.html?path=" +
                encodeURIComponent(directory);

            const name =
                directory
                    .split("/")
                    .pop()
                    .replace(/[-_]/g," ");

            a.textContent =
                "📁 " + name;

            div.appendChild(a);

            content.appendChild(div);

        });


    /*
     * Afficher les PDF
     */

    directFiles
        .sort((a,b) =>
            a.localeCompare(b,"fr")
        )
        .forEach(file => {

            found = true;

            const div =
                document.createElement("div");

            div.className = "item";

            const a =
                document.createElement("a");

            a.href =
                file
                    .split("/")
                    .map(encodeURIComponent)
                    .join("/");

            a.target = "_blank";

            a.rel = "noopener";

            const name =
                file.split("/").pop();

            a.textContent =
                "📄 " + name;

            div.appendChild(a);

            content.appendChild(div);

        });


    /*
     * Aucun document
     */

    if(!found){

        content.innerHTML =
            "<div class='error'>" +
            "Aucun document PDF dans ce dossier." +
            "</div>";

    }

})


.catch(error => {

    document.getElementById("content").innerHTML =

        "<div class='error'>" +

        "<strong>Impossible de charger les documents.</strong>" +

        "<br><br>" +

        error.message +

        "</div>";

});

</script>

</body>
</html>
