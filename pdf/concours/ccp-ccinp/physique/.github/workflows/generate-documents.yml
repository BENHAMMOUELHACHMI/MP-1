name: Mise à jour automatique des documents

on:
  push:
    paths:
      - 'pdf/**'
      - '.github/workflows/generate-documents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer documents.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("pdf")

          files = []

          if root.exists():
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix.lower() == ".pdf":
                      files.append(
                          p.as_posix()
                      )

          files.sort()

          with open("documents.json", "w", encoding="utf-8") as f:
              json.dump(files, f, ensure_ascii=False, indent=2)

          print(f"{len(files)} document(s) trouvé(s)")
          PY

      - name: Enregistrer documents.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "Mise à jour automatique des documents"
            git push
          fi
